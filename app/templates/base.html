<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}G-Posts VS{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>.htmx-indicator { display: none; } .htmx-request.htmx-indicator { display: inline; }</style>
</head>
<div id="confirm-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 max-w-sm w-full shadow-lg">
        <p id="confirm-message" class="mb-4 text-gray-800"></p>
        <div class="flex justify-end gap-2">
            <button id="confirm-cancel" class="px-3 py-1 rounded border text-gray-600 hover:bg-gray-50">Cancel</button>
            <button id="confirm-ok" class="px-3 py-1 rounded bg-red-600 text-white hover:bg-red-700">Remove</button>
        </div>
    </div>
</div>
<script>
    document.body.addEventListener('htmx:confirm', function (e) {
        if (!e.detail.question) return;
        e.preventDefault();

        const modal = document.getElementById('confirm-modal');
        const message = document.getElementById('confirm-message');
        const okBtn = document.getElementById('confirm-ok');
        const cancelBtn = document.getElementById('confirm-cancel');

        message.textContent = e.detail.question;
        modal.classList.remove('hidden');

        function cleanup() {
            modal.classList.add('hidden');
            okBtn.removeEventListener('click', onOk);
            cancelBtn.removeEventListener('click', onCancel);
        }
        function onOk() {
            cleanup();
            e.detail.issueRequest(true);
        }
        function onCancel() {
            cleanup();
        }
        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
    });
</script>
<body class="bg-gray-50 text-gray-900">
    <nav class="bg-white border-b px-6 py-4 flex gap-6">
        <a href="/" class="font-semibold">G-Posts VS</a>
        <a href="/posts" class="text-gray-600 hover:text-gray-900">Repository</a>
        <a href="/projects" class="text-gray-600 hover:text-gray-900">Projects</a>
    </nav>
    <main class="p-6 max-w-6xl mx-auto">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
