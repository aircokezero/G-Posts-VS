{% if limit_message %}
<div class="bg-amber-50 border border-amber-200 rounded p-3 text-sm text-amber-800">{{ limit_message }}</div>
{% endif %}

{% for m in messages %}
<div class="{{ 'self-end bg-gray-900 text-white' if m.role == 'user' else 'self-start bg-gray-100 text-gray-800' }} rounded-lg px-3 py-2 max-w-[80%] text-sm">
    {{ m.content }}
</div>
{% else %}
<p class="text-sm text-gray-500">Ask a question below, or pick a suggestion.</p>
{% endfor %}
